{% extends "base.html" %}

{% block content %}
<div class="text-center mb-12">
    <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight">Portal de Residentes</h1>
    <p class="mt-4 text-lg text-gray-500 max-w-2xl mx-auto">Selecciona tu edificio e ingresa la contraseña proporcionada por la administración para consultar los estados de cuenta mensuales.</p>
</div>

<!-- Grid de los 4 edificios -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
    {% for b in edificios %}
    <div class="bg-white rounded-2xl shadow-md overflow-hidden border border-gray-200 hover:shadow-xl transition-shadow duration-300 flex flex-col">
        
        <!-- Área de la Imagen / Logo del edificio -->
        <!-- Se intentará cargar la imagen desde la carpeta "static" usando el nombre del edificio. -->
        <div class="h-40 {{ b.color_tema }} flex items-center justify-center p-6 relative group overflow-hidden">
            <!-- Si tienes las imágenes, guárdalas en la carpeta "static" como 1.png, 2.png, etc. -->
            <div class="absolute inset-0 bg-black bg-opacity-10 group-hover:bg-opacity-0 transition"></div>
            
            <div class="z-10 text-center">
                <!-- Puedes cambiar esto por una etiqueta <img src="/static/logo_{{ b.id }}.png"> cuando tengas las imágenes cortadas -->
                <h3 class="text-2xl font-black text-white drop-shadow-lg leading-tight">{{ b.nombre }}</h3>
            </div>
        </div>
        
        <!-- Formulario de contraseña -->
        <div class="p-6 flex-grow flex flex-col justify-center bg-gray-50">
            <form action="{{ url_for('acceso_edificio', edificio_id=b.id) }}" method="POST" class="space-y-4">
                <div>
                    <label for="password_{{ b.id }}" class="block text-sm font-semibold text-gray-700 mb-1">Contraseña de acceso:</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        </div>
                        <input type="password" id="password_{{ b.id }}" name="password" placeholder="••••••••" required 
                            class="pl-10 w-full border-gray-300 rounded-lg shadow-sm border p-2.5 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                    </div>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-lg hover:bg-indigo-700 focus:ring-4 focus:ring-indigo-200 transition">
                    Ingresar
                </button>
            </form>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
