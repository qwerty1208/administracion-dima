{% extends "base.html" %}

{% block content %}
<div class="min-h-[65vh] flex items-center justify-center px-4">
    <div class="max-w-md w-full mx-auto bg-white p-10 rounded-2xl shadow-2xl border border-gray-100">
        
        <!-- Cabecera del Login -->
        <div class="text-center mb-10">
            <div class="w-20 h-20 bg-gray-900 text-white rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-lg transform rotate-3 hover:rotate-0 transition">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h2 class="text-3xl font-black text-gray-900">Acceso Seguro</h2>
            <p class="text-md text-gray-500 mt-2 font-medium">Solo personal autorizado de DIMA</p>
        </div>
        
        <!-- Formulario -->
        <form action="{{ url_for('admin_login') }}" method="POST" class="space-y-6">
            <div>
                <label for="usuario" class="block text-sm font-bold text-gray-700 mb-2">Nombre de Usuario</label>
                <input type="text" id="usuario" name="usuario" required autocomplete="off"
                    class="w-full border-gray-300 rounded-lg border p-3 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none transition bg-gray-50 focus:bg-white text-gray-900">
            </div>
            <div>
                <label for="password" class="block text-sm font-bold text-gray-700 mb-2">Contraseña</label>
                <input type="password" id="password" name="password" required 
                    class="w-full border-gray-300 rounded-lg border p-3 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none transition bg-gray-50 focus:bg-white text-gray-900">
            </div>
            
            <div class="pt-2">
                <button type="submit" class="w-full bg-gray-900 text-white font-bold text-lg py-3 rounded-lg hover:bg-gray-800 focus:ring-4 focus:ring-gray-300 transition shadow-md">
                    Iniciar Sesión
                </button>
            </div>
        </form>
        
        <!-- Botón regresar -->
        <div class="mt-6 text-center">
            <a href="{{ url_for('index') }}" class="text-sm text-gray-500 hover:text-indigo-600 font-semibold transition">
                ← Volver al Portal de Residentes
            </a>
        </div>
    </div>
</div>
{% endblock %}
